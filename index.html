<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Version Checker</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100dvh;

            background-color: #333;
            color: #FFF;
        }

        .weird {
            position: absolute;
            overflow: visible;
            width: 100%;
            height: 100%;
        }

        .weird::before, .weird::after {
            --size: 150dvh;
            --x-pos: -75%;
            content: "";
            position: absolute;
            top: 50%;
            translate: 0 -50%;
            width: var(--size);
            height: var(--size);
            border-radius: 50% 40% 20% 80%;
            background: #5b5b5b;
            overflow: visible;
            animation: rotate 50s infinite normal both linear;
            
        }

        .weird::before {
            left: var(--x-pos);
        }

        .weird::after {
            right: var(--x-pos);
            animation-direction: reverse;
        }

        @keyframes rotate {
            0% {
                border-radius: 50% 40% 20% 80%;
            }

            25% {
                border-radius: 100% 20% 40% 50%;
            }

            50% {
                border-radius: 20% 80% 100% 40%;
            }

            75% {
                border-radius: 80% 100% 20% 10%;
            }

            100% {
                border-radius: 50% 40% 20% 80%;
                rotate: 360deg;
            }
        }
    </style>
</head>
<body>
    <p>Please, go away :)</p>
    <br>
    <div class="weird"></div>
    <br>
    <p>Thanks.</p>
</body>
</html>
